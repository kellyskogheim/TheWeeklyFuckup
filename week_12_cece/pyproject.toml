[project]
name = "cas-ce-agent"
version = "0.1.0"
description = "Local-first CAS and USQS continuing education tracker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.170",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
ce-agent = "ce_agent.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_agent"]

