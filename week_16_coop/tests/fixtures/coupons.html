<!doctype html>
<html lang="en">
  <head><title>Dollar General Coupons</title></head>
  <body>
    <main>
      <h1>Explore Deals</h1>
      <section aria-label="Coupons &amp; Cash Back" data-total-coupons="2">
        <h2>Coupons &amp; Cash Back</h2>
        <article data-testid="coupon-card">
          <h3>Example detergent</h3>
          <p>Save $2.00 on one qualifying item. Expires 2099-12-31.</p>
          <button data-testid="clip-control">Clip this deal</button>
        </article>
        <article data-testid="coupon-card">
          <h3>Example paper product</h3>
          <p>Save $1.00 on two qualifying items. Expires 2099-12-31.</p>
          <button data-testid="clip-control">Clip this deal</button>
        </article>
      </section>
    </main>
  </body>
</html>
