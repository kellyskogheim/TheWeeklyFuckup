<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Weekly Fuckup Games</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182235;
      --muted: #5b687d;
      --paper: rgba(255, 255, 255, 0.9);
      --line: rgba(24, 34, 53, 0.12);
      --yellow: #ffd642;
      --blue: #4aa8ff;
      --shadow: rgba(24, 34, 53, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 214, 66, 0.34), transparent 26rem),
        radial-gradient(circle at 84% 12%, rgba(74, 168, 255, 0.24), transparent 24rem),
        linear-gradient(135deg, #eafff4 0%, #f8fbff 48%, #fff4d7 100%);
    }

    main {
      width: min(680px, 100%);
      padding: 24px;
      border: 3px solid rgba(255, 255, 255, 0.88);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 22px 60px var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.4rem);
      line-height: 0.95;
    }

    p {
      margin: 10px 0 20px;
      color: var(--muted);
      font-weight: 800;
    }

    a {
      display: block;
      padding: 16px 18px;
      border: 2px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #ffffff;
      box-shadow: inset 0 -4px 0 rgba(24, 34, 53, 0.12);
      font-size: 1.2rem;
      font-weight: 900;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--blue);
      outline: 3px solid rgba(74, 168, 255, 0.36);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <h1>The Weekly Fuckup Games</h1>
    <p>Playable browser experiments from the 18-week AI-assisted coding project.</p>
    <a href="./week_09_midway/snake-zoom.html">Play Snake Zoom</a>
  </main>
</body>
</html>
