<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Number Snake Adventure! 🎈</title>
    <style>
        body {
            background-color: #FFDEE9;
            background-image: linear-gradient(0deg, #FFDEE9 0%, #B5FFFC 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #FF4081;
            font-size: 3rem;
            margin: 10px 0 5px 0;
            text-shadow: 3px 3px 0px #FFF;
        }

        #instruction-box {
            background-color: white;
            border: 4px solid #4CAF50;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            box-shadow: 0px 8px 0px #4CAF50;
            text-align: center;
        }

        #target-number {
            font-weight: bold;
            color: #FF5722;
            font-size: 2rem;
            display: inline-block;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        #game-container {
            position: relative;
            background-color: #FFFDE7;
            border: 8px solid #FFC107;
            border-radius: 25px;
            box-shadow: 0px 12px 0px #FFA000;
        }

        canvas {
            display: block;
            border-radius: 17px;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #555;
            font-weight: bold;
        }

        /* Pop-up Overlay for Game Over / Win */
        #overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 17px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        #overlay-box {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            border: 5px solid #FF4081;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        #overlay-text {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #E91E63;
        }

        #restart-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: inherit;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #388E3C;
        }

        #restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #388E3C;
        }
    </style>
</head>
<body>

    <h1>🐍 Number Snake! 🌟</h1>
    
    <div id="instruction-box">
        Find and eat the number: <span id="target-number">1</span> !
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="overlay">
            <div id="overlay-box">
                <div id="overlay-text">Oops! Try Again!</div>
                <button id="restart-btn" onclick="resetGame()">Play Again 🎈</button>
            </div>
        </div>
    </div>

    <div class="controls-hint">Use your keyboard ⬅️ ⬆️ ➡️ ⬇️ Arrow Keys to steer!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const targetDisplay = document.getElementById("target-number");
        const overlay = document.getElementById("overlay");
        const overlayText = document.getElementById("overlay-text");

        const GRID_SIZE = 24; // Slightly larger grid so numbers inside segments are easier to read
        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        // Game State Variables
        let snake = []; // Array of {x, y, num}
        let dx = GRID_SIZE;
        let dy = 0;
        let currentSequence = 1;
        let foodItems = []; // Array of {x, y, value, color}
        let gameInterval;
        let isGameOver = false;

        // Soft kid-friendly colors for bubbles
        const bubbleColors = ["#FF6B6B", "#4D96FF", "#6BCB77", "#FFA1A1", "#9B5DE5", "#F15BB5"];

        function initGame() {
            // Start snake with a head and no body numbers yet
            snake = [
                {x: GRID_SIZE * 5, y: GRID_SIZE * 8, num: null},
                {x: GRID_SIZE * 4, y: GRID_SIZE * 8, num: null},
                {x: GRID_SIZE * 3, y: GRID_SIZE * 8, num: null}
            ];
            dx = GRID_SIZE;
            dy = 0;
            currentSequence = 1;
            isGameOver = false;
            overlay.style.display = "none";
            updateTargetDisplay();
            spawnNumbers();
            
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 140); // Gentle kid-friendly speed
        }

        function updateTargetDisplay() {
            targetDisplay.innerText = currentSequence;
        }

        // Generate 1 correct number and 2 incorrect ones
        function spawnNumbers() {
            foodItems = [];
            
            let correctNum = currentSequence;
            let wrong1 = correctNum + Math.floor(Math.random() * 3) + 1;
            let wrong2 = Math.max(1, correctNum - Math.floor(Math.random() * 2) - 1);
            if (wrong2 === correctNum || wrong2 === wrong1) {
                wrong2 = correctNum + 4; 
            }

            let numbersToSpawn = [correctNum, wrong1, wrong2];

            numbersToSpawn.forEach((num) => {
                let position = getRandomGridPosition();
                let randomColor = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
                
                foodItems.push({
                    x: position.x,
                    y: position.y,
                    value: num,
                    color: randomColor
                });
            });
        }

        function getRandomGridPosition() {
            let posX, posY;
            let overlapping = true;

            while (overlapping) {
                posX = Math.floor(Math.random() * (WIDTH / GRID_SIZE)) * GRID_SIZE;
                posY = Math.floor(Math.random() * (HEIGHT / GRID_SIZE)) * GRID_SIZE;
                
                // Keep it slightly away from borders so text is visible
                if (posX < GRID_SIZE) posX += GRID_SIZE;
                if (posX > WIDTH - GRID_SIZE * 2) posX -= GRID_SIZE;
                if (posY < GRID_SIZE) posY += GRID_SIZE;
                if (posY > HEIGHT - GRID_SIZE * 2) posY -= GRID_SIZE;

                overlapping = false;

                for (let segment of snake) {
                    if (segment.x === posX && segment.y === posY) {
                        overlapping = true;
                        break;
                    }
                }

                for (let food of foodItems) {
                    if (food.x === posX && food.y === posY) {
                        overlapping = true;
                        break;
                    }
                }
            }
            return { x: posX, y: posY };
        }

        function gameLoop() {
            if (isGameOver) return;

            moveSnake();
            checkCollisions();
            draw();
        }

        function moveSnake() {
            let newHeadX = snake[0].x + dx;
            let newHeadY = snake[0].y + dy;

            // Screen wrapping mechanics
            if (newHeadX < 0) newHeadX = WIDTH - GRID_SIZE;
            if (newHeadX >= WIDTH) newHeadX = 0;
            if (newHeadY < 0) newHeadY = HEIGHT - GRID_SIZE;
            if (newHeadY >= HEIGHT) newHeadY = 0;

            // The new head starts with no number assignment
            const head = { x: newHeadX, y: newHeadY, num: null };
            
            // Check if head is eating any number
            let ateFoodIndex = -1;
            for (let i = 0; i < foodItems.length; i++) {
                if (head.x === foodItems[i].x && head.y === foodItems[i].y) {
                    ateFoodIndex = i;
                    break;
                }
            }

            if (ateFoodIndex !== -1) {
                let eatenFood = foodItems[ateFoodIndex];
                
                if (eatenFood.value === currentSequence) {
                    // YAY! Correct number!
                    // Assign the eaten number directly to the segment right BEHIND the new head
                    snake[0].num = currentSequence; 

                    currentSequence++;
                    updateTargetDisplay();
                    spawnNumbers(); 
                    
                    // Add new head to front, do NOT pop the tail so it grows
                    snake.unshift(head);
                } else {
                    // Oops! Bit the wrong number!
                    triggerGameOver("Oops! That was " + eatenFood.value + ".\nWe needed " + currentSequence + "! 🎈");
                }
            } else {
                // Just normal moving: Shift the numbers down the body segments!
                // To keep the sequence in chronological order from neck to tail,
                // we pass numbers down before moving the head.
                for(let i = snake.length - 1; i > 0; i--) {
                    snake[i].num = snake[i-1].num;
                }
                snake[0].num = null; // New segment behind head starts empty until passed down

                snake.unshift(head); // Insert new head
                snake.pop(); // Remove old tail segment
            }
        }

        function checkCollisions() {
            const head = snake[0];
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver("Oops! You bumped into yourself! 🪱");
                }
            }
        }

        function triggerGameOver(message) {
            isGameOver = true;
            clearInterval(gameInterval);
            overlayText.innerHTML = message.replace('\n', '<br>');
            overlay.style.display = "flex";
        }

        function resetGame() {
            initGame();
        }

        function draw() {
            // Clear board
            ctx.fillStyle = "#FFFDE7";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Draw Decorative Grid lines (very faint)
            ctx.strokeStyle = "#FFF9C4";
            ctx.lineWidth = 1;
            for (let i = 0; i < WIDTH; i += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, HEIGHT); ctx.stroke();
            }
            for (let j = 0; j < HEIGHT; j += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(WIDTH, j); ctx.stroke();
            }

            // Draw Floating Numbers (Bubbles)
            foodItems.forEach(food => {
                ctx.fillStyle = food.color;
                ctx.beginPath();
                ctx.arc(food.x + GRID_SIZE/2, food.y + GRID_SIZE/2, GRID_SIZE * 0.9, 0, Math.PI * 2);
                ctx.fill();
                
                // Bubble Shine
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath();
                ctx.arc(food.x + GRID_SIZE * 0.35, food.y + GRID_SIZE * 0.35, GRID_SIZE * 0.25, 0, Math.PI * 2);
                ctx.fill();

                // Number
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 16px 'Comic Sans MS', Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(food.value, food.x + GRID_SIZE/2, food.y + GRID_SIZE/2 + 1);
            });

            // Draw Snake (with Numbers!)
            for (let i = snake.length - 1; i >= 0; i--) {
                let segment = snake[i];
                
                if (i === 0) {
                    // Head
                    ctx.fillStyle = "#4CAF50";
                    ctx.beginPath();
                    ctx.arc(segment.x + GRID_SIZE/2, segment.y + GRID_SIZE/2, GRID_SIZE * 0.65, 0, Math.PI * 2);
                    ctx.fill();

                    // Cute Eyes
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(segment.x + GRID_SIZE * 0.35, segment.y + GRID_SIZE * 0.35, 4, 0, Math.PI * 2);
                    ctx.arc(segment.x + GRID_SIZE * 0.65, segment.y + GRID_SIZE * 0.35, 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "black";
                    ctx.beginPath();
                    ctx.arc(segment.x + GRID_SIZE * 0.35, segment.y + GRID_SIZE * 0.35, 2, 0, Math.PI * 2);
                    ctx.arc(segment.x + GRID_SIZE * 0.65, segment.y + GRID_SIZE * 0.35, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Body Segment
                    ctx.fillStyle = (i % 2 === 0) ? "#8BC34A" : "#CDDC39";
                    ctx.beginPath();
                    ctx.arc(segment.x + GRID_SIZE/2, segment.y + GRID_SIZE/2, GRID_SIZE * 0.55, 0, Math.PI * 2);
                    ctx.fill();

                    // If this body segment has an assigned number, draw it!
                    if (segment.num !== null) {
                        ctx.fillStyle = "#33691E"; // Dark green text for readability
                        ctx.font = "bold 13px 'Comic Sans MS', Arial";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(segment.num, segment.x + GRID_SIZE/2, segment.y + GRID_SIZE/2);
                    }
                }
            }
        }

        // Keyboard inputs
        window.addEventListener("keydown", e => {
            switch(e.key) {
                case "ArrowUp":
                case "KeyW":
                    if (dy === 0) { dx = 0; dy = -GRID_SIZE; }
                    e.preventDefault();
                    break;
                case "ArrowDown":
                case "KeyS":
                    if (dy === 0) { dx = 0; dy = GRID_SIZE; }
                    e.preventDefault();
                    break;
                case "ArrowLeft":
                case "KeyA":
                    if (dx === 0) { dx = -GRID_SIZE; dy = 0; }
                    e.preventDefault();
                    break;
                case "ArrowRight":
                case "KeyD":
                    if (dx === 0) { dx = GRID_SIZE; dy = 0; }
                    e.preventDefault();
                    break;
            }
        });

        initGame();
    </script>
</body>
</html>
