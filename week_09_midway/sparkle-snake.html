<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparkle Snake</title>
  <style>
    :root {
      --ink: #263044;
      --panel: rgba(255, 255, 255, 0.88);
      --mint: #44c7a1;
      --leaf: #1e9f73;
      --rose: #ff6f91;
      --sun: #ffd166;
      --sky: #56c7ff;
      --violet: #8f7cff;
      --shadow: rgba(31, 43, 74, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 209, 102, 0.42), transparent 26rem),
        radial-gradient(circle at 88% 8%, rgba(86, 199, 255, 0.35), transparent 22rem),
        linear-gradient(135deg, #fff6c8 0%, #d9f8ef 43%, #e7edff 100%);
    }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0 26px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 0.95;
      color: #21324c;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.58);
    }

    .tagline {
      margin: 7px 0 0;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .score-card {
      min-width: 160px;
      padding: 12px 16px;
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 32px var(--shadow);
      text-align: center;
    }

    .score-card span {
      display: block;
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-card strong {
      display: block;
      margin-top: 2px;
      color: var(--rose);
      font-size: 2.2rem;
      line-height: 1;
    }

    .game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 318px;
      gap: 16px;
      align-items: start;
    }

    .board-wrap,
    .side {
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 20px 48px var(--shadow);
    }

    .board-wrap {
      position: relative;
      overflow: hidden;
      min-height: 320px;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: calc(100vh - 188px);
      background: #fff9dc;
    }

    .message {
      position: absolute;
      inset: auto 18px 18px;
      display: grid;
      gap: 6px;
      justify-items: center;
      padding: 14px;
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 12px 26px rgba(44, 66, 95, 0.18);
      text-align: center;
      pointer-events: none;
    }

    .message[hidden] {
      display: none;
    }

    .message strong {
      color: var(--leaf);
      font-size: 1.3rem;
    }

    .message span {
      font-weight: 800;
    }

    .side {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .panel {
      padding: 12px;
      border: 2px solid rgba(38, 48, 68, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.64);
    }

    .panel h2 {
      margin: 0 0 9px;
      font-size: 0.86rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mode-row,
    .speed-row,
    .button-row {
      display: grid;
      gap: 8px;
    }

    .mode-row {
      grid-template-columns: 1fr;
    }

    .speed-row {
      grid-template-columns: repeat(5, 1fr);
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      color: #21324c;
      background: #eaf2ff;
      box-shadow: inset 0 -3px 0 rgba(38, 48, 68, 0.14);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      outline: 3px solid rgba(86, 199, 255, 0.55);
      outline-offset: 2px;
    }

    button.is-selected,
    #startButton {
      background: var(--sun);
    }

    #easyButton {
      background: #d9f8ef;
    }

    #easyButton.is-off {
      background: #eceff4;
      color: #617086;
    }

    .target-card {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 12px;
      align-items: center;
    }

    .bubble {
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border: 4px solid #ffffff;
      border-radius: 50%;
      color: #21324c;
      background: var(--sun);
      box-shadow: 0 8px 20px rgba(38, 48, 68, 0.16);
      font-size: 2rem;
      font-weight: 1000;
    }

    .target-copy {
      margin: 0;
      font-weight: 900;
      line-height: 1.25;
    }

    .prompt-word {
      display: inline-block;
      font-size: 1.45em;
      color: var(--rose);
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.88);
    }

    .target-card.is-off .bubble {
      background: #e9edf4;
      color: #758299;
    }

    .target-card.is-off .target-copy {
      color: #66748a;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(3, 48px);
      justify-content: center;
      gap: 6px;
    }

    .controls button {
      min-height: 48px;
      background: #ffffff;
      font-size: 1.35rem;
    }

    .controls .up {
      grid-column: 2;
    }

    .controls .left {
      grid-column: 1;
      grid-row: 2;
    }

    .controls .right {
      grid-column: 3;
      grid-row: 2;
    }

    .controls .down {
      grid-column: 2;
      grid-row: 3;
    }

    @media (max-width: 860px) {
      header,
      .game {
        grid-template-columns: 1fr;
      }

      .score-card {
        width: 100%;
      }

      canvas {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Sparkle Snake</h1>
        <p class="tagline">Loop around, collect the right treats, and grow a glittery tail.</p>
      </div>
      <div class="score-card" aria-live="polite">
        <span>Yummy score</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <section class="game" aria-label="Sparkle Snake game">
      <div class="board-wrap">
        <canvas id="board" width="720" height="720" aria-label="Snake game board"></canvas>
        <div class="message" id="message">
          <strong id="messageTitle">Ready?</strong>
          <span id="messageText">Pick a game, press Start, then steer the snake.</span>
        </div>
      </div>

      <aside class="side">
        <section class="panel">
          <h2>Game</h2>
          <div class="mode-row" role="group" aria-label="Choose game">
            <button class="is-selected" type="button" data-mode="counting">Counting</button>
            <button type="button" data-mode="alphabet">Alphabet</button>
            <button type="button" data-mode="spelling">Spelling</button>
          </div>
        </section>

        <section class="panel">
          <h2>Play</h2>
          <div class="button-row">
            <button type="button" id="startButton">Start</button>
            <button type="button" id="easyButton">Easy: On</button>
          </div>
        </section>

        <section class="panel">
          <h2>Speed</h2>
          <div class="speed-row" role="group" aria-label="Snake speed">
            <button type="button" data-speed="1">1</button>
            <button type="button" data-speed="2">2</button>
            <button class="is-selected" type="button" data-speed="3">3</button>
            <button type="button" data-speed="4">4</button>
            <button type="button" data-speed="5">5</button>
          </div>
        </section>

        <section class="panel">
          <h2 id="hintTitle">Next Number</h2>
          <div class="target-card" id="hintPanel" aria-live="polite">
            <div class="bubble" id="nextTarget">3</div>
            <p class="target-copy" id="nextTargetText">Eat this number next.</p>
          </div>
        </section>

        <section class="panel">
          <h2>Move</h2>
          <div class="controls" role="group" aria-label="Move snake">
            <button class="up" type="button" aria-label="Move up" data-dir="0,-1">▲</button>
            <button class="left" type="button" aria-label="Move left" data-dir="-1,0">◀</button>
            <button class="right" type="button" aria-label="Move right" data-dir="1,0">▶</button>
            <button class="down" type="button" aria-label="Move down" data-dir="0,1">▼</button>
          </div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.querySelector("#score");
    const startButton = document.querySelector("#startButton");
    const easyButton = document.querySelector("#easyButton");
    const hintTitle = document.querySelector("#hintTitle");
    const hintPanel = document.querySelector("#hintPanel");
    const nextTarget = document.querySelector("#nextTarget");
    const nextTargetText = document.querySelector("#nextTargetText");
    const message = document.querySelector("#message");
    const messageTitle = document.querySelector("#messageTitle");
    const messageText = document.querySelector("#messageText");
    const modeButtons = [...document.querySelectorAll("[data-mode]")];
    const speedButtons = [...document.querySelectorAll("[data-speed]")];

    const grid = 18;
    const cell = canvas.width / grid;
    const speedMs = { 1: 430, 2: 330, 3: 240, 4: 170, 5: 115 };
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const spellingWords = ["CAT", "DOG", "SUN", "JAM", "BUG", "HAT", "MOON", "STAR", "FISH", "BIRD"];
    const wordColors = ["#ff4f7b", "#168f74", "#2364d2", "#b35cff", "#f48c06", "#00a6a6"];
    const snackColors = ["#ffd166", "#56c7ff", "#ff8fab", "#95d66b", "#c6a4ff"];
    const maxBodyPieces = 15;

    let snake;
    let direction;
    let queuedDirection;
    let foods;
    let sparkles;
    let running = false;
    let easyMode = true;
    let score = 0;
    let mode = "counting";
    let speed = 3;
    let tickTimer = null;
    let nextValue = 3;
    let countingHighest = 2;
    let alphabetHighestIndex = 1;
    let spellingWordIndex = 0;
    let spellingLetterIndex = 0;
    let spellingSegments = [];

    function resetGame() {
      snake = [
        { x: 8, y: 9, label: "", color: "#44c7a1" },
        { x: 7, y: 9, label: initialTailLabel(0), color: "#30b68e" },
        { x: 6, y: 9, label: initialTailLabel(1), color: "#24a37e" }
      ];
      direction = { x: 1, y: 0 };
      queuedDirection = { x: 1, y: 0 };
      foods = [];
      sparkles = [];
      score = 0;
      countingHighest = 2;
      alphabetHighestIndex = 1;
      spellingLetterIndex = 0;
      spellingSegments = [];
      running = false;
      startButton.textContent = "Start";
      message.hidden = false;
      messageTitle.textContent = "Ready?";
      messageText.textContent = "Pick a game, press Start, then steer the snake.";
      updateNextValue();
      updateBodyLabels();
      spawnFoods();
      updateUi();
      draw();
      stopTimer();
    }

    function initialTailLabel(index) {
      if (mode === "counting") return String(index + 1);
      if (mode === "alphabet") return alphabet[index];
      return "";
    }

    function currentWord() {
      return spellingWords[spellingWordIndex % spellingWords.length];
    }

    function currentWordColor() {
      return wordColors[spellingWordIndex % wordColors.length];
    }

    function updateNextValue() {
      if (mode === "counting") {
        nextValue = countingHighest + 1;
      } else if (mode === "alphabet") {
        nextValue = alphabet[Math.min(alphabetHighestIndex + 1, alphabet.length - 1)];
      } else {
        nextValue = currentWord()[spellingLetterIndex];
      }
    }

    function labelForNewSegment() {
      if (mode === "counting") return String(snake.length);
      if (mode === "alphabet") return nextValue;
      return nextValue;
    }

    function colorForNewSegment() {
      if (mode === "spelling") return currentWordColor();
      return snackColors[score % snackColors.length];
    }

    function spawnFoods() {
      updateNextValue();
      const values = choiceValuesFor(nextValue);
      foods = values.map((value, index) => ({
        value,
        x: 0,
        y: 0,
        color: snackColors[index % snackColors.length]
      }));

      foods.forEach((food) => {
        let spot;
        do {
          spot = {
            x: Math.floor(Math.random() * grid),
            y: Math.floor(Math.random() * grid)
          };
        } while (isOccupied(spot.x, spot.y) || foods.some((item) => item !== food && item.x === spot.x && item.y === spot.y));
        food.x = spot.x;
        food.y = spot.y;
      });
    }

    function choiceValuesFor(correctValue) {
      const wrongChoices = [];
      distractorsFor(correctValue).forEach((candidate) => {
        if (candidate !== correctValue && !wrongChoices.includes(candidate)) {
          wrongChoices.push(candidate);
        }
      });

      let fallbackOffset = 1;
      while (wrongChoices.length < 2) {
        const fallback = fallbackDistractor(correctValue, fallbackOffset);
        if (fallback !== correctValue && !wrongChoices.includes(fallback)) {
          wrongChoices.push(fallback);
        }
        fallbackOffset += 1;
      }

      return shuffle([correctValue, ...wrongChoices.slice(0, 2)]);
    }

    function fallbackDistractor(value, offset) {
      if (mode === "counting") return Number(value) + offset + 1;
      if (mode === "alphabet") {
        const index = alphabet.indexOf(value);
        return alphabet[(index + offset) % alphabet.length];
      }
      const index = alphabet.indexOf(value);
      return alphabet[(index + offset) % alphabet.length];
    }

    function distractorsFor(value) {
      if (mode === "counting") {
        const base = Number(value);
        return shuffle([base + 2, base + 3, Math.max(1, base - 2), base + 5]).filter((item) => item !== base);
      }
      if (mode === "alphabet") {
        const index = alphabet.indexOf(value);
        return shuffle([index + 2, index + 5, index - 3, index + 9])
          .filter((item) => item >= 0 && item < alphabet.length && alphabet[item] !== value)
          .map((item) => alphabet[item]);
      }
      const pool = alphabet.filter((letter) => letter !== value && !currentWord().includes(letter));
      return shuffle(pool).slice(0, 3);
    }

    function updateBodyLabels() {
      const bodyCount = snake.length - 1;
      const countingStart = Math.max(1, countingHighest - bodyCount + 1);
      const alphabetStart = Math.max(0, alphabetHighestIndex - bodyCount + 1);

      snake.forEach((part, index) => {
        if (index === 0) {
          part.label = "";
          part.color = "#44c7a1";
          return;
        }

        if (mode === "counting") {
          part.label = String(countingStart + index - 1);
          part.color = snackColors[(index - 1) % snackColors.length];
          return;
        }

        if (mode === "alphabet") {
          part.label = alphabet[alphabetStart + index - 1] || "";
          part.color = snackColors[(index - 1) % snackColors.length];
          return;
        }

        const segment = spellingSegments[index - 1];
        part.label = segment ? segment.letter : "";
        part.color = segment ? segment.color : "#30b68e";
      });
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function isOccupied(x, y) {
      return snake.some((part) => part.x === x && part.y === y);
    }

    function setDirection(x, y) {
      if (direction.x + x === 0 && direction.y + y === 0) return;
      queuedDirection = { x, y };
    }

    function startOrRestart() {
      if (running) {
        resetGame();
        return;
      }
      running = true;
      message.hidden = true;
      startButton.textContent = "Restart";
      startTimer();
    }

    function startTimer() {
      stopTimer();
      tickTimer = window.setInterval(tick, speedMs[speed]);
      window.tickTimer = tickTimer;
    }

    function stopTimer() {
      if (tickTimer) window.clearInterval(tickTimer);
      tickTimer = null;
      window.tickTimer = null;
    }

    function tick() {
      direction = queuedDirection;
      const head = snake[0];
      const next = {
        x: wrap(head.x + direction.x),
        y: wrap(head.y + direction.y),
        label: "",
        color: "#44c7a1"
      };

      const bumpedSelf = snake.some((part, index) => index > 0 && part.x === next.x && part.y === next.y);
      if (bumpedSelf) {
        if (easyMode) {
          sparkleAt(head.x, head.y, "#56c7ff");
          draw();
          return;
        }
        endRound("Bonk!", "Press Restart and try a new wiggle path.");
        return;
      }

      snake.unshift(next);
      const food = foods.find((item) => item.x === next.x && item.y === next.y);
      if (food && food.value === nextValue) {
        snake[1].label = labelForNewSegment();
        snake[1].color = colorForNewSegment();
        handleCorrectFood(food);
        capSnakeBody();
      } else {
        snake.pop();
        if (food) {
          message.hidden = false;
          messageTitle.textContent = "Try again";
          messageText.textContent = hintForWrongFood();
          window.setTimeout(() => {
            if (running) message.hidden = true;
          }, 1100);
        }
      }

      updateBodyLabels();
      updateSparkles();
      updateUi();
      draw();
    }

    function capSnakeBody() {
      while (snake.length > maxBodyPieces + 1) {
        snake.pop();
      }
      if (mode === "spelling" && spellingSegments.length > maxBodyPieces) {
        spellingSegments = spellingSegments.slice(-maxBodyPieces);
      }
    }

    function handleCorrectFood(food) {
      score += 1;
      sparkleAt(food.x, food.y, food.color);

      if (mode === "counting") {
        countingHighest = Number(nextValue);
      } else if (mode === "alphabet") {
        alphabetHighestIndex = Math.max(alphabetHighestIndex, alphabet.indexOf(nextValue));
      }

      if (mode === "spelling") {
        spellingSegments.push({
          letter: nextValue,
          wordIndex: spellingWordIndex,
          color: currentWordColor()
        });
        spellingLetterIndex += 1;
        if (spellingLetterIndex >= currentWord().length) {
          spellingWordIndex += 1;
          spellingLetterIndex = 0;
          message.hidden = false;
          messageTitle.textContent = "Word complete!";
          messageText.textContent = "Nice spelling.";
          window.setTimeout(() => {
            if (running) message.hidden = true;
          }, 1000);
        }
      }

      if (mode === "alphabet" && nextValue === "Z") {
        endRound("A to Z!", "You ate the whole alphabet.");
        return;
      }

      spawnFoods();
    }

    function hintForWrongFood() {
      if (mode === "counting") return `Look for ${nextValue}.`;
      if (mode === "alphabet") return `Find ${nextValue} next.`;
      return `Spell ${currentWord()}.`;
    }

    function wrap(value) {
      if (value < 0) return grid - 1;
      if (value >= grid) return 0;
      return value;
    }

    function endRound(title, text) {
      running = false;
      stopTimer();
      startButton.textContent = "Restart";
      message.hidden = false;
      messageTitle.textContent = title;
      messageText.textContent = text;
    }

    function sparkleAt(x, y, color) {
      for (let index = 0; index < 14; index += 1) {
        sparkles.push({
          x: (x + 0.5) * cell,
          y: (y + 0.5) * cell,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 24,
          color
        });
      }
    }

    function updateSparkles() {
      sparkles = sparkles
        .map((sparkle) => ({
          ...sparkle,
          x: sparkle.x + sparkle.vx,
          y: sparkle.y + sparkle.vy,
          vy: sparkle.vy + 0.08,
          life: sparkle.life - 1
        }))
        .filter((sparkle) => sparkle.life > 0);
    }

    function updateUi() {
      scoreEl.textContent = score;
      easyButton.textContent = easyMode ? "Easy: On" : "Easy: Off";
      easyButton.classList.toggle("is-off", !easyMode);
      hintPanel.classList.toggle("is-off", !easyMode && mode !== "spelling");

      if (mode === "counting") {
        hintTitle.textContent = "Next Number";
        nextTarget.textContent = easyMode ? nextValue : "?";
        nextTargetText.textContent = easyMode ? "Eat this number next." : "Hints are hiding.";
      } else if (mode === "alphabet") {
        hintTitle.textContent = "Next Letter";
        nextTarget.textContent = easyMode ? nextValue : "?";
        nextTargetText.textContent = easyMode ? "Eat this letter next." : "Hints are hiding.";
      } else {
        const word = currentWord();
        hintTitle.textContent = "Spell";
        nextTarget.textContent = easyMode ? nextValue : "?";
        nextTargetText.innerHTML = `Spell <span class="prompt-word" style="color: ${currentWordColor()}">${word}</span>.`;
      }
    }

    function draw() {
      drawBackground();
      foods.forEach(drawFood);
      snake.forEach(drawSnakePart);
      sparkles.forEach(drawSparkle);
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff9dc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(38, 48, 68, 0.06)";
      ctx.lineWidth = 2;
      for (let index = 0; index <= grid; index += 1) {
        ctx.beginPath();
        ctx.moveTo(index * cell, 0);
        ctx.lineTo(index * cell, canvas.height);
        ctx.moveTo(0, index * cell);
        ctx.lineTo(canvas.width, index * cell);
        ctx.stroke();
      }
    }

    function drawFood(food) {
      const centerX = (food.x + 0.5) * cell;
      const centerY = (food.y + 0.5) * cell;
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.fillStyle = food.color;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, cell * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#21324c";
      ctx.font = `900 ${cell * 0.42}px Trebuchet MS, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(food.value, 0, 1);
      ctx.restore();
    }

    function drawSnakePart(part, index) {
      const x = part.x * cell;
      const y = part.y * cell;
      const radius = cell * 0.33;
      ctx.save();
      ctx.translate(x + cell / 2, y + cell / 2);
      ctx.fillStyle = index === 0 ? "#44c7a1" : part.color;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (index === 0) {
        ctx.fillStyle = "#21324c";
        ctx.beginPath();
        ctx.arc(-cell * 0.12, -cell * 0.08, cell * 0.045, 0, Math.PI * 2);
        ctx.arc(cell * 0.12, -cell * 0.08, cell * 0.045, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#21324c";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, cell * 0.05, cell * 0.13, 0.1, Math.PI - 0.1);
        ctx.stroke();
      } else if (part.label) {
        ctx.fillStyle = "#21324c";
        ctx.font = `900 ${cell * 0.32}px Trebuchet MS, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(part.label, 0, 1);
      }
      ctx.restore();
    }

    function drawSparkle(sparkle) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, sparkle.life / 24);
      ctx.fillStyle = sparkle.color;
      ctx.translate(sparkle.x, sparkle.y);
      ctx.rotate(sparkle.life);
      ctx.fillRect(-3, -3, 6, 6);
      ctx.restore();
    }

    startButton.addEventListener("click", startOrRestart);
    easyButton.addEventListener("click", () => {
      easyMode = !easyMode;
      updateUi();
      draw();
    });

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        modeButtons.forEach((item) => item.classList.toggle("is-selected", item === button));
        spellingWordIndex = 0;
        resetGame();
      });
    });

    speedButtons.forEach((button) => {
      button.addEventListener("click", () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach((item) => item.classList.toggle("is-selected", item === button));
        if (running) startTimer();
      });
    });

    document.querySelectorAll("[data-dir]").forEach((button) => {
      button.addEventListener("click", () => {
        const [x, y] = button.dataset.dir.split(",").map(Number);
        setDirection(x, y);
      });
    });

    window.addEventListener("keydown", (event) => {
      const keys = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
      };
      const next = keys[event.key];
      if (!next) return;
      event.preventDefault();
      setDirection(next[0], next[1]);
    });

    resetGame();
  </script>
</body>
</html>
